# ============================================================
#  bot-mindscape 配置示例
#  复制为 config.yaml 后按需修改
# ============================================================

# ── 认知层：长期记忆 ──
memory:
  max_chars: 2500          # 每轮请求注入的记忆字数上限（越小越省 token）
  min_chars: 50            # 少于此长度就不注入
  digest_chars: 1200       # 「每日摘要」注入上限（分层记忆的骨架层）
  notes_chars: 800         # 「账本」注入上限（bot 自己写的，细节问题看它）
  bots:
    - self_id: "20000000"                      # 你的 bot 账号
      name: "bot-name"                         # 显示名（只用于日志）
      diary: "./data/bot-name.md"              # 长期记忆文件（diary 模块写入）
      memory_chars: 2500                       # 可覆盖全局值
      people: "./data/bot-name.people.md"      # 人物画像（由 diary 自动生成，可留空）
      people_chars: 800                        # 人物画像注入上限
      digest: "./data/bot-name.digest.md"      # 每日摘要（由下面的 digest 段生成，留空则不注入）
      # notes: bot **自己能写**的账本（工具 save_note 维护）。日记与摘要都是后台
      #        生成的、检索只读 —— bot 能承诺却没地方落笔，于是同一件细节问几次
      #        能答出几个样。给它一本账，细节才有稳定答案。
      notes: "./data/bot-name.notes.md"
      # style: 「说话风格」文件（由下面的 learn 段学出来）。
      #        留空 = 不注入，这个 bot 完全不受影响 —— 想给哪个 bot 开就写哪个。
      #        单独成层是因为它回答的是「怎么说」，而日记回答「发生了什么」。
      # style: "./data/bot-name.style.md"
      # style_chars: 800                         # 风格层注入上限
      # rules: 这个 bot 自己的行为规矩，随记忆一起注入。
      #        写在这里而不是代码里 —— 通用框架不该硬编码某个人设特有的规矩。
      # rules:
      #   - "……"

# ── 认知层：记忆生成 ──
diary:
  source:
    db: "./data/messages.db"                   # 消息库路径
    table: "messages"                          # 表名
    where: "event_name='group_message'"        # 可选：过滤条件
    fields:
      time: "timestamp"                        # 时间字段（Unix 秒）
      seq: "sequence"                          # 自增序号（用于增量）
      data: "data"                             # JSON 内容字段
  targets:
    - self_id: "20000000"
      name: "bot-name"
      groups: ["20000001"]                     # 只记这些群（留空=全部）
      output: "./data/bot-name.md"
      state: "./data/bot-name.state.json"
      # relations: 从人格档案里取「关系与称呼」这类段落，作为不会被自动摘要
      #            覆盖的权威条目。没有它，摘要会把「喜欢的人」写成「群友」。
      # relations:
      #   file: "./persona/soul.md"
      #   section: "关系与称呼"
      # persona: 决定日记用什么口吻写（留空则用内置默认，内置默认会同时产出 diary 和 people）
      persona: "你在翻阅自己所在群聊的记录。只记发生了什么有趣的事，不要总结任何人的说话风格。只输出 JSON：{\"diary\":[\"条目1\"],\"people\":{\"昵称\":\"一句话描述\"}}"
  llm:
    api_base: "https://api.example.com/v1"     # OpenAI 兼容接口
    api_key_env: "MINDSCAPE_API_KEY"           # 从环境变量读 key
    # api_key_file: "./secrets/key.txt"        # 或者从文件读
    model: "your-model"
  batch: 40
  max_input_chars: 14000
  max_tokens: 900
  # max_batches: 40                              # 单次运行最多处理几批（默认 40 批 = 40×batch 条）

# ── 认知层：每日摘要（分层记忆的骨架）──
# 滑动窗口只覆盖最近几小时。一个活跃群一天能写一万多字日记，2500 字预算只够
# 四五个小时 —— bot 每天醒来都「忘了昨天」。这里为每个「已过完的日期」生成
# 一句概括，注入时和原文一起进 prompt。每个日期只会调一次 LLM。
digest:
  enabled: true
  targets:
    - name: "bot-name"
      diary: "./data/bot-name.md"              # 源：日记文件
      output: "./data/bot-name.digest.md"      # 产物：每日摘要（memory.bots[].digest 指向它）
  llm:
    api_base: "https://api.example.com/v1"
    api_key_env: "MINDSCAPE_API_KEY"           # 或 api_key_file
    model: "your-model"
  min_entries: 3                               # 少于这么多条的一天不生成
  max_chars: 260                               # 每条摘要字数上限
  max_input_chars: 24000                       # 一天的条目太多时均匀抽样到这个长度
  max_tokens: 400
  keep_days: 30                                # 只保留最近这么多天
  max_per_run: 3                               # 单次最多补几天（首次回填会分几次跑完）

# ── 认知层：风格学习 / 人格蒸馏（**默认关闭**）──
# 从「某个人」的真实语料里学他**怎么说话**，产物喂给 memory.bots[].style。
# 典型场景：用自己的人格搭 bot，让 bot 对齐自己的语气。
#
# 三条约束：
#   1. 默认关闭 —— enabled 不为真就一行都不跑
#   2. 不耦合   —— 「学什么」由 targets[].persona 决定，通用框架不预设人设
#   3. 不碰别人 —— 本模块只写文件；谁读它完全由各自 bot 的 memory 配置决定
learn:
  enabled: false                               # ← 要显式打开
  source:                                      # 和 diary.source 同结构
    db: "./data/messages.db"
    table: "messages"
    where: "event_name='group_message'"
    fields:
      time: "timestamp"
      seq: "sequence"
      data: "data"
  batch: 20                                    # 每批多少条交给 LLM
  max_batches: 40                              # 单次运行最多几批（防首次回填烧钱）
  max_input_chars: 12000
  max_tokens: 1200
  llm:
    api_base: "https://api.example.com/v1"
    api_key_env: "MINDSCAPE_API_KEY"
    model: "your-model"
    temperature: 0.4                           # 提炼类任务别太放飞
  targets:
    - name: "bot-name"
      user_id: "20000000"                      # 学**谁**（通常是你自己）
      output: "./data/bot-name.style.md"       # 风格产物 → memory.bots[].style
      notes: "./data/bot-name.style-notes.md"  # 事实产物（可另行注入或检索）
      # persona: 决定「学什么」。不写则用内置兜底 prompt。
      #          这是本模块唯一需要针对具体人定制的地方。
      # persona: |
      #   你是「说话风格研究员」，正在观察 <某人> 的群消息……

# ── 表达层：素材采集与调度 ──
stickers:
  dir: "./data/stickers"
  index: "./data/stickers/index.json"
  sample_prob: 0.10                            # 采样概率（越高越费 API）
  targets:
    - self_id: "20000000"
      category: "bot-name"                     # 本 bot 独占的图库分类
  judge:
    api_base: "https://api.example.com/v1"
    api_key_env: "MINDSCAPE_API_KEY"
    model: "your-vision-model"                 # 需要支持图片输入
    persona: "一名温柔的学生少女"
    # max_side: 图片任一边超过这个像素数就**不入库**（默认 1200）。
    #   判据用**分辨率**而不是文件体积：大 GIF 往往正是最合适的那张（帧多自然大），
    #   压缩或丢弃都会把好东西扔掉；而 1920×1080 这种尺寸才是「抓错了」的铁证
    #   —— 实测视觉模型会把游戏截图判成「二次元可爱」。读文件头几乎零成本，
    #   而且挡在视觉判定之前，顺手省掉一次 API。
    max_side: 1200
    max_tokens: 2000
  send:
    force_prob: 0.10                           # 强制配图概率（治「不发图惯性」）
    candidates: 12                             # 每次给模型看的候选数
    formation:                                 # 队形：群里在斗图时跟着发
      enabled: true
      window: 90                               # 判定窗口（秒）
      need_same: 2                             # 同图出现几次算「在斗图」
      prob: 0.35                               # 斗图时的跟进概率（比平时高）

# ── 沉浸层：报错拦截 ──
guard:
  # 这里的 patterns 是【追加】到内置默认规则之上的（不会替换掉默认规则）。
  # 也就是说：留空 = 只用内置默认；写几条 = 默认 + 你写的这几条。
  patterns:
    - "API Error"
    - "Request timed out"
    - "Traceback (most recent call last)"
  regex: "(?:[A-Za-z_]*Error|[A-Za-z_]*Exception|Timeout|Failed)\\s*[:：]"

# ── 沉浸层：输出规范 ──
format:
  targets: ["20000000"]
  join_with: "，"
  drop_last_if_short: false
  short_len: 8

# ── 运维层：会话清理 ──
janitor:
  db: "./data/conversations.db"
  table: "conversations"
  column: "content"
  max_mb: 2.0
  log: "./data/janitor.log"

# ── 唤醒层：什么时候该回应 ──
# 注意：原生框架一般只支持「前缀唤醒」和「@唤醒」。
#       「提到名字必回 + 低概率冒泡 + 每 bot 独立配置」需要框架层支持，
#       本项目的做法见 patches/ 目录（含自动安装脚本）。
waking:
  sample_prob: 0.02          # 全局默认：没被提到时的冒泡概率
  min_interval: 600          # 全局默认：两次冒泡的最小间隔（秒）
  bots:
    - self_id: "20000000"
      enabled: true
      names:                 # 提到这些词 = 必回（大小写敏感按框架实现）
        - "bot-name"
        - "小名"
      exclude:               # 提到这些词则不触发（防误唤醒）
        - "别人的名字"
      reply_on_at: true      # 被 @ 时必回
      sample_prob: 0.02      # 本 bot 的冒泡概率（覆盖全局）
      min_interval: 600      # 本 bot 的冒泡间隔（覆盖全局）
      groups: ["20000001"]   # 只在这些群活动（留空=全部）

# ── 本地管理台（可选）──
# 配置了 ui.sync 后，运行 scripts/web_ui.py 会出现「拉取/推送」按钮，
# 可在本地浏览、改名、改标签、移除素材，然后一键同步到远端。
# 不配置 = 纯本地工具（开源默认形态）。
ui:
  sync:
    enabled: false                # 改成 true 才启用
    host: "1.2.3.4"
    port: 22
    user: "root"
    password: ""                  # 或用 key_file（优先）
    # key_file: "~/.ssh/id_rsa"
    remote_dir: "/opt/your-bot/data/stickers"
    remote_index: "stickers_index.json"   # 远端索引文件名
    timeout: 25
