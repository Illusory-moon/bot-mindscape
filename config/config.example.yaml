# ============================================================
#  bot-mindscape 配置示例
#  复制为 config.yaml 后按需修改
# ============================================================

# ── 认知层：长期记忆 ──
memory:
  max_chars: 2500          # 每轮请求注入的记忆字数上限（越小越省 token）
  min_chars: 50            # 少于此长度就不注入
  digest_chars: 1200       # 「每日摘要」注入上限（分层记忆的骨架层）
  notes_chars: 800         # 「账本」注入上限（bot 自己写的，细节问题看它）
  bots:
    - self_id: "20000000"                      # 你的 bot 账号
      name: "bot-name"                         # 显示名（只用于日志）
      diary: "./data/bot-name.md"              # 长期记忆文件（diary 模块写入）
      memory_chars: 2500                       # 可覆盖全局值
      people: "./data/bot-name.people.md"      # 人物画像（由 diary 自动生成，可留空）
      people_chars: 800                        # 人物画像注入上限
      digest: "./data/bot-name.digest.md"      # 每日摘要（由下面的 digest 段生成，留空则不注入）
      # notes: bot **自己能写**的账本（工具 save_note 维护）。日记与摘要都是后台
      #        生成的、检索只读 —— bot 能承诺却没地方落笔，于是同一件细节问几次
      #        能答出几个样。给它一本账，细节才有稳定答案。
      notes: "./data/bot-name.notes.md"
      # style: 「说话风格」文件（由下面的 learn 段学出来）。
      #        留空 = 不注入，这个 bot 完全不受影响 —— 想给哪个 bot 开就写哪个。
      #        单独成层是因为它回答的是「怎么说」，而日记回答「发生了什么」。
      # style: "./data/bot-name.style-stable.md"  # 稳定层（全周期压缩，见 style 段）
      # style_chars: 800                         # 稳定层注入上限
      # style_recent: "./data/bot-name.style-recent.md"  # 近期层（最近几天的原始条目）
      # style_recent_chars: 400                  # 近期层注入上限
      # knowledge: 查阅型文档 —— 平时【不注入 prompt】，只有问到相关问题时
      #            才用 lookup_knowledge 工具去查。适合「战斗数据」「人物关系」
      #            「产品手册」这类又长、又只有偶尔用得上的资料。
      #            为什么不直接注入：一份战斗档案动辄 8~9KB，塞进去会直接
      #            吃光整个记忆预算（2500 字），而 99% 的对话根本用不到。
      #            检索按【二级标题分段】—— 问「配队」直接给整段，不是散落的几行。
      #            写这类文档时，**一个角色 / 一个主题就占一个二级标题**：
      #            分段越细，命中越准，也不会一整块糊进上下文。
      # knowledge:
      #   - name: "战斗数据"
      #     path: "./data/bot-name.combat.md"
      #     desc: "配队 / 光锥 / 遗器 / 星魂 / 机制 / 玩法"
      #   - name: "人物关系"
      #     path: "./data/bot-name.relations.md"
      #     desc: "认识的每个角色：外号 / 称呼 / 具体关系"
      #
      # rules: 这个 bot 自己的行为规矩，随记忆一起注入。
      #        写在这里而不是代码里 —— 通用框架不该硬编码某个人设特有的规矩。
      # rules:
      #   - "……"
      #
      # ⭐ 强烈建议保留下面这条：群里天天冒新梗、谐音、缩写，模型看不懂的时候
      #    「硬接一个不相干的」比「说没听懂」难看一百倍（真实案例：有人用谐音梗
      #    调侃战力，bot 当成错别字纠正了，场面瞬间割裂）。
      #    注意：**别在这里规定它怎么说**（「啥意思」太大众化）—— 让它用自己的口吻问，
      #    每个 bot 的问法都该不一样。
      #   - "听不懂就问，别装懂：群里出现按字面讲不通的说法（谐音、缩写、圈内黑话、梗），
      #      不要当成错别字去纠正，也不要硬接一个不相干的。用你自己的口吻问回去。"

# ── 认知层：上下文补齐（群聊缓冲，**默认关闭**）──
# 唤醒判定发生在框架的**消息分发阶段**，比插件更早 —— 没被唤醒的群消息不进上下文。
# 于是「A 说我吃了 KFC（没叫 bot）→ B 说带我去吃呗（叫了 bot）」时，
# bot 只看到后半句，回一句「吃什么？」。这里把该群最近的对话补进 system_prompt，
# 并先判一次「本条消息到底是不是对你说的」。
#
# ⚠️ **它依赖 `patches/astrbot`（框架补丁）**：补丁负责把所有群消息落盘、
#    并记下唤醒原因（@ / 引用 / 提到名字 / 都不是）。没打补丁就打开，
#    定向性会退化成「这句不是对你说的」—— **比不注入更糟**，所以默认关。
#    装法见 docs/deploy.md「可选的框架集成」。
groupctx:
  enabled: false
  buffer: ""            # 留空 = 补丁的落盘路径 /opt/astrbot/data/group_ctx_buffer.jsonl
  count: 15             # 注入该群最近多少条
  window_sec: 1800      # 只取 30 分钟内的（太旧的不算上下文）
  tail_bytes: 524288    # 只读文件尾部这么多字节（缓冲是追加流，不需要整读）
  directness: true      # 注入「本条消息的定向性」（依赖补丁记的 wake_reason）
  images: true          # 历史消息里带的图也挂给模型（真人不管引用与否都看得见）
  image_max: 1          # 最多挂几张 —— 每多一张 = 多一次视觉推理，模型会慢十几秒，1 张够用
  image_window_sec: 120 # 只管最近 2 分钟发的（「发完马上问」的窗口）
  image_same_sender: true  # 只挂「跟当前说话的人同一个发送者」的图，别把别人的图乱塞给她
  targets: []           # 留空 = 所有 bot；填 self_id 则只对这几个生效

# ── 表达层：真 @（点名）──
# 模型嘴里的「@某某」只是正文里的字符（被点的人收不到提醒）；本模块给它一个 at_user 工具，
# 想真点名时发出**真的 at 段**。名字→号：先吃群缓冲，再问 OneBot 要成员名单兜底。
mention:
  enabled: true
  targets: []           # 留空 = 所有 bot；填 self_id 则只对这几个生效

# ── 认知层：记忆生成 ──
diary:
  source:
    db: "./data/messages.db"                   # 消息库路径
    table: "messages"                          # 表名
    where: "event_name='group_message'"        # 可选：过滤条件
    fields:
      time: "timestamp"                        # 时间字段（Unix 秒）
      seq: "sequence"                          # 自增序号（用于增量）
      data: "data"                             # JSON 内容字段
  targets:
    - self_id: "20000000"
      name: "bot-name"
      groups: ["20000001"]                     # 只记这些群（留空=全部）
      output: "./data/bot-name.md"
      state: "./data/bot-name.state.json"
      # relations: 从人格档案里取「关系与称呼」这类段落，作为不会被自动摘要
      #            覆盖的权威条目。没有它，摘要会把「喜欢的人」写成「群友」。
      # relations:
      #   file: "./persona/soul.md"
      #   section: "关系与称呼"
      # persona: 决定日记用什么口吻写（留空则用内置默认，内置默认会同时产出 diary 和 people）
      persona: "你在翻阅自己所在群聊的记录。只记发生了什么有趣的事，不要总结任何人的说话风格。只输出 JSON：{\"diary\":[\"条目1\"],\"people\":{\"昵称\":\"一句话描述\"}}"
  llm:
    api_base: "https://api.example.com/v1"     # OpenAI 兼容接口
    api_key_env: "MINDSCAPE_API_KEY"           # 从环境变量读 key
    # api_key_file: "./secrets/key.txt"        # 或者从文件读
    model: "your-model"
  batch: 40
  max_input_chars: 14000
  max_tokens: 900
  # max_batches: 40                              # 单次运行最多处理几批（默认 40 批 = 40×batch 条）

# ── 认知层：每日摘要（分层记忆的骨架）──
# 滑动窗口只覆盖最近几小时。一个活跃群一天能写一万多字日记，2500 字预算只够
# 四五个小时 —— bot 每天醒来都「忘了昨天」。这里为每个「已过完的日期」生成
# 一句概括，注入时和原文一起进 prompt。每个日期只会调一次 LLM。
digest:
  enabled: true
  targets:
    - name: "bot-name"
      diary: "./data/bot-name.md"              # 源：日记文件
      output: "./data/bot-name.digest.md"      # 产物：每日摘要（memory.bots[].digest 指向它）
  llm:
    api_base: "https://api.example.com/v1"
    api_key_env: "MINDSCAPE_API_KEY"           # 或 api_key_file
    model: "your-model"
  min_entries: 3                               # 少于这么多条的一天不生成
  max_chars: 260                               # 每条摘要字数上限
  max_input_chars: 24000                       # 一天的条目太多时均匀抽样到这个长度
  max_tokens: 400
  keep_days: 30                                # 只保留最近这么多天
  max_per_run: 3                               # 单次最多补几天（首次回填会分几次跑完）

# ── 认知层：风格学习 / 人格蒸馏（**默认关闭**）──
# 从「某个人」的真实语料里学他**怎么说话**，产物喂给 memory.bots[].style。
# 典型场景：用自己的人格搭 bot，让 bot 对齐自己的语气。
#
# 三条约束：
#   1. 默认关闭 —— enabled 不为真就一行都不跑
#   2. 不耦合   —— 「学什么」由 targets[].persona 决定，通用框架不预设人设
#   3. 不碰别人 —— 本模块只写文件；谁读它完全由各自 bot 的 memory 配置决定
learn:
  enabled: false                               # ← 要显式打开
  source:                                      # 和 diary.source 同结构
    db: "./data/messages.db"
    table: "messages"
    where: "event_name='group_message'"
    fields:
      time: "timestamp"
      seq: "sequence"
      data: "data"
  batch: 20                                    # 每批多少条交给 LLM
  max_batches: 40                              # 单次运行最多几批（防首次回填烧钱）
  max_input_chars: 12000
  max_tokens: 1200
  llm:
    api_base: "https://api.example.com/v1"
    api_key_env: "MINDSCAPE_API_KEY"
    model: "your-model"
    temperature: 0.4                           # 提炼类任务别太放飞
  targets:
    - name: "bot-name"
      user_id: "20000000"                      # 学**谁**（通常是你自己）
      output: "./data/bot-name.style.md"       # 风格产物 → memory.bots[].style
      notes: "./data/bot-name.style-notes.md"  # 事实产物（可另行注入或检索）
      # persona: 决定「学什么」。不写则用内置兜底 prompt。
      #          这是本模块唯一需要针对具体人定制的地方。
      # persona: |
      #   你是「说话风格研究员」，正在观察 <某人> 的群消息……

# ── 认知层：风格压缩（把 learn 的原文压成 稳定层 + 近期层）──
# learn 产出的是追加式原文，一天三千多字，越滚越长；而记忆每轮只能注入固定字数，
# 于是 prompt 里看到的**永远是「当天的尾巴」**，15 天里反复出现的稳定特质挤不进去。
#
#   稳定层：对【全周期】条目均匀抽样后压一遍，**每次覆盖写**。
#           覆盖是关键 —— 追加会越滚越旧，覆盖永远是最新共识。
#   近期层：最近 N 天的风格条目原样留下，捕捉「口癖在变」。
#
# ⚠️ 只收「观察 / 新词 / 原声示例」三类，**不收 兴趣 / 值得记的** ——
#    那些是事实，混进风格层会让 bot 把它们当成自己的记忆说出来。
style:
  enabled: false
  llm:
    api_base: "https://api.example.com/v1"
    api_key_env: "MINDSCAPE_API_KEY"
    model: "your-model"
    temperature: 0.3                           # 压缩要稳，别放飞
  max_input_chars: 24000                       # 全周期条目均匀抽样到这个长度
  max_tokens: 900
  max_stable_chars: 1000                       # 稳定层硬上限（在行边界截断）
  targets:
    - name: "bot-name"
      source: "./data/bot-name.style.md"                 # learn 的产物（追加式原文）
      stable: "./data/bot-name.style-stable.md"          # 产物：稳定层（覆盖写）
      recent: "./data/bot-name.style-recent.md"          # 产物：近期层（覆盖写）
      recent_days: 2                                     # 近期层回看几天
      # exclude: 不许出现在风格层里的词 —— 只可能是**别人的昵称**。
      #   学习端偶尔会把别人的昵称误读成「自称变体」（比如群里有人被这么叫），
      #   压缩端还可能把「自称或他人」这种含糊观察里的 hedge 丢掉。
      #   靠 prompt 约束不可靠，所以给一个确定性逃生口：喂给 LLM 之前就剔除，
      #   产出之后再剔一遍（只删词不删行，一行里往往还有别的有用信息）。
      # exclude: ["某人的昵称", "另一个"]

# ── 表达层：素材采集与调度 ──
stickers:
  dir: "./data/stickers"
  index: "./data/stickers/index.json"
  sample_prob: 0.10                            # 采样概率（越高越费 API）
  targets:
    - self_id: "20000000"
      category: "bot-name"                     # 本 bot 独占的图库分类
  judge:
    api_base: "https://api.example.com/v1"
    api_key_env: "MINDSCAPE_API_KEY"
    model: "your-vision-model"                 # 需要支持图片输入
    persona: "一名温柔的学生少女"
    # max_side: 图片任一边超过这个像素数就**不入库**（默认 1200）。
    #   判据用**分辨率**而不是文件体积：大 GIF 往往正是最合适的那张（帧多自然大），
    #   压缩或丢弃都会把好东西扔掉；而 1920×1080 这种尺寸才是「抓错了」的铁证
    #   —— 实测视觉模型会把游戏截图判成「二次元可爱」。读文件头几乎零成本，
    #   而且挡在视觉判定之前，顺手省掉一次 API。
    max_side: 1200
    max_tokens: 2000
  send:
    force_prob: 0.10                           # 强制配图概率（治「不发图惯性」）
    candidates: 12                             # 每次给模型看的候选数
    formation:                                 # 队形：群里在斗图时跟着发
      enabled: true
      window: 90                               # 判定窗口（秒）
      need_same: 2                             # 同图出现几次算「在斗图」
      prob: 0.35                               # 斗图时的跟进概率（比平时高）

# ── 沉浸层：报错拦截 ──
guard:
  # 「直接 send」的兜底（默认开）：框架有两条报错出口**不走结果管线** ——
  #   agent 阶段抛异常（internal.py 的 except）、LLM 构建失败，都是直接 event.send()。
  #   挂在 on_decorating_result 上的拦截永远看不到它们（实测漏过一次真实报错：
  #   QQ 表情 CDN 404 → 群里收到一句英文 Error occurred while processing agent request…）。
  #   打开后给平台事件类的 send() 包一层：命中报错特征就不发，只记日志。
  send_guard: true
  # 这里的 patterns 是【追加】到内置默认规则之上的（不会替换掉默认规则）。
  # 也就是说：留空 = 只用内置默认；写几条 = 默认 + 你写的这几条。
  patterns:
    - "API Error"
    - "Request timed out"
    - "Traceback (most recent call last)"
  regex: "(?:[A-Za-z_]*Error|[A-Za-z_]*Exception|Timeout|Failed)\\s*[:：]"

# ── 沉浸层：沉默的权利（**默认关闭**）──
# 提示词里写「你可以不回复」是不够的 —— 框架总得发一条出去，
# 于是「没话说」只能演成「（和我无关，安静飘过）」。
# 打开之后：模型不想说话时只输出 token，本模块把整条回复清空，群里毫无动静。
# 只作用于【回复轮】；自主冒泡轮不调工具就是沉默，不需要 token。
silence:
  enabled: false
  token: "[[silence]]"
  targets: []          # 留空 = 所有 bot；填 self_id 则只对这几个生效
  prompt: ""           # 留空 = 用内置提示词

# ── 沉浸层：空回复救援（推理模型的通病）──
# 推理模型（DeepSeek V4 / R1 这类）偶尔会「思考链正常、正文为空」，
# 框架拿到空正文就跳过发送 —— 用户看到的是「叫它不理」。
# 本模块检测到这种情况，用一次极轻量的调用补一句话，再发出去。
#
# ⚠️ 两个关键点：
#   1. model 一定要选【非推理模型】—— 推理模型会重蹈覆辙，再给你一个空正文
#   2. persona 只是兜底；正常情况下救援会带上这个 bot 本轮真实的人设 / 记忆 / 风格
rescue:
  enabled: true
  api_base: "https://api.deepseek.com/v1"
  api_key_env: "MINDSCAPE_API_KEY"     # 从环境变量读 key
  model: "deepseek-chat"               # ← 非推理模型！
  persona: "一个自然的聊天伙伴"          # 仅在拿不到人设快照时兜底
  # 有意为之：救援补话时【允许】它选择沉默（输出沉默令牌）——
  # 「这一轮该不该说话」最终由 bot 自己判断，救援只负责别卡成一条空回复。
  max_tokens: 120
  timeout: 20

# ── 沉浸层：输出规范 ──
format:
  targets: ["20000000"]
  join_with: "，"
  drop_last_if_short: false
  short_len: 8
  # 句尾去句号（**子选项：留空 = 关**，不是「全部生效」）——
  # 列在这里的 bot，出站文本里**不会再出现「。」**：末尾的句号直接去掉（留空），
  # 句中的换成「，」接着往下走。有些角色就是不用句号收尾，
  # 而「句号 = 说完了」恰恰是模型的强惯性 —— 提示词压不住，只能发送前剃掉。
  # ⚠️ 不是一律换成「~」：沉重的句子配波浪号会变味，留空才对。
  # no_period: ["20000000"]

# ── 观测层：每一轮记一条「请求多大 / 模型多久」（默认开）──
# 慢这件事如果没有数据，就只能靠猜 —— 记忆注入？群上下文？工具轮？还是模型本身？
# 这一层在所有注入模块【都跑完之后】量一次出站体积，在模型回来时量一次耗时，
# 一行一条打进日志，直接回答「多大 + 多久」。
#   - 体积看 sys / 上下文：异常注入会第一时间体现在数字上
#   - 耗时看「耗时=」：这是端到端真实延迟，不是事后拼时间戳拼出来的
# 只记尺寸与耗时，不记任何正文。
trace:
  enabled: true
  warn_ms: 8000        # 慢于此 → 日志级别升级成 WARNING（方便 grep）
  warn_chars: 20000    # system_prompt 超过这个字数 → 疑似异常注入，同样升级
                       # （实测常态约 13800：人格正文 + 记忆三层 + 15 条群记录）

# ── 运维层：会话清理（**独立脚本**，不进插件产物）──
# 要治的病：框架会把聊天里的图片以 base64 内联进会话历史。实测一次事故 ——
#   群里一张图落进历史，**单条 48 万字**，那个会话每轮请求都带着它
#   （≈12 万 token，直接顶穿上下文窗口）→ 那一两轮必然超时 / 不说话。
# 处理顺序：**先脱图，再删行** ——
#   1) 含 data:image…;base64 的记录：把那坨数据换成「[图片]」，会话上下文原样保留
#   2) 改不动的行（不是 JSON）或仍然超大的整行：删掉兜底
# 建议每 1~5 分钟跑一次（`python plugins/mindscape_janitor.py`），窗口越长，
#   中间那几轮就越可能带着几百 KB 的请求去打模型。
janitor:
  # 框架的会话库。AstrBot 4.x 在 <数据目录>/data_v4.db；填绝对路径最稳。
  db: "./data/conversations.db"
  table: "conversations"
  column: "content"
  max_mb: 2.0            # 单行超过这个大小直接删（脱图兜不住的那种）
  log: "./data/janitor.log"

# ── 发言档案：把 bot 自己的历史回复搬出会话 ──
# 为什么：会话里「它自己的历史回复」是最强的风格锚 —— 它会照着自己抄，逐日滚雪球
#   （实测：某群 19 条回复里 18 条同一个开头；同期新建的群 13 条里 0 条）。
#   但那些话是它的记忆，不能删 ✗。
# 做法：janitor 每次运行时把它的**纯回复**原样搬进档案文件，会话里只留最近 keep_last 条
#   （防连续对话断片）；它需要时用 recall_memory 从档案里把原话取回来 ✓。
# 通用：prefix / file / keep_last / labels 全在这里，代码里没有任何 bot 的名字或号。
archive:
  id_column: "user_id"          # 会话表里存会话 id 的列（AstrBot 是 user_id）
  # ⚠️ target 可以带自己的 `source:`（db / table / where / fields ✓）—— 顶层那份是默认值。
  #    典型用法：群消息和私聊在同一个库里是两个 event_name，想让私聊也有一份日记，
  #    就再写一个 target、把 where 换成私聊事件即可（输出另开一个文件 ✓，
  #    再把它加进 memory.bots[].extra_diaries 就会被注入 ✓）。
  targets:
    - self_id: "20000000"       # 哪个 bot（与 memory.bots[].self_id 对上）
      prefix: "platform:GroupMessage:"   # 会话 id 前缀（形如 <平台实例>:GroupMessage:<群号>）
      file: "./data/said.md"    # 档案文件（追加式 markdown）
      keep_last: 1              # 会话里保留它最近几条纯回复（1 = 只留最新一条）
      labels:                   # 可选：让档案里的群名可读；缺省用会话里的号
        "123456789": "某个群"
    - self_id: "20000001"
      prefix: "another:GroupMessage:"
      file: "./data/said2.md"
      keep_last: 1

# ── 唤醒层：什么时候该回应 ──
# 注意：原生框架一般只支持「前缀唤醒」和「@唤醒」。
#       「提到名字必回 + 低概率冒泡 + 每 bot 独立配置」需要框架层支持，
#       本项目的做法见 patches/ 目录（含自动安装脚本）。
waking:
  sample_prob: 0.02          # 全局默认：没被提到时的冒泡概率
  min_interval: 600          # 全局默认：两次冒泡的最小间隔（秒）
  bots:
    - self_id: "20000000"
      enabled: true
      names:                 # 提到这些词 = 必回（大小写敏感按框架实现）
        - "bot-name"
        - "小名"
      exclude:               # 提到这些词则不触发（防误唤醒）
        - "别人的名字"
      reply_on_at: true      # 被 @ 时必回
      sample_prob: 0.02      # 本 bot 的冒泡概率（覆盖全局）
      min_interval: 600      # 本 bot 的冒泡间隔（覆盖全局）
      groups: ["20000001"]   # 只在这些群活动（留空=全部）

# ── 本地管理台（可选）──
# 配置了 ui.sync 后，运行 scripts/web_ui.py 会出现「拉取/推送」按钮，
# 可在本地浏览、改名、改标签、移除素材，然后一键同步到远端。
# 不配置 = 纯本地工具（开源默认形态）。
ui:
  sync:
    enabled: false                # 改成 true 才启用
    host: "1.2.3.4"
    port: 22
    user: "root"
    password: ""                  # 或用 key_file（优先）
    # key_file: "~/.ssh/id_rsa"
    remote_dir: "/opt/your-bot/data/stickers"
    remote_index: "stickers_index.json"   # 远端索引文件名
    timeout: 25
    # Web 管理台完整配置同步（远端路径可按实际部署覆盖）
    remote_config: "/opt/astrbot/data/plugin_data/astrbot_plugin_mindscape/config.yaml"
    remote_wake: "/opt/astrbot/data/auto_wake_cfg.json"
    # restart_command: "docker restart your-bot-container"  # 同步后自动生效
    # 日志页默认抓 janitor.log 所在目录的 .log；若 restart_command 是 docker restart，
    # 也抓对应容器最近 2000 行。其他来源可在本机配置里追加：
    # remote_logs: ["/opt/your-bot/other.log"]
    # log_containers: ["another-container"]
# ── 前置黑名单（可选）──
# 命中的人：消息在【事件最早阶段】就被 stop_event 拦掉 ——
# 不回复、不采集图片、不进任何插件的视野。
# 为什么必须前置：「不收图」这半边靠 LLM 阶段的拦截做不到，
# 图片在更早的消息事件阶段就被采集器拿走了。
# 与 AstrBot 核心的白名单不同：那个粒度是会话/群，这个是群内某个人；
# 而且 targets 按 self_id 分开写，几个 bot 互不牵连。
# blocklist:
#   enabled: true
#   targets:
#     - self_id: "<bot 的 QQ 号>"
#       users: ["<要屏蔽的 QQ 号>", "..."]
#       note: "自动 @ + 发图的群友或 bot"

# ── 有图时的识图提醒（可选）──
# 只在「这一轮真的带了图」时注入一句：先查再认，查完还不确定就承认看不清。
# 兜底那句话【故意不写死】—— 只给方向，措辞交给角色自己（写死会被原样照抄）。
# targets 留空 = 所有 bot 都生效。
# vision:
#   enabled: true
#   targets: ["<bot 的 QQ 号>"]
